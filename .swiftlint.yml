included:
  - Airlance
  - submodules

excluded:
  - submodules/AsyncDisplayKit
  - submodules/sqlcipher

only_rules:
  - block_based_kvo
  - class_delegate_protocol
  - compiler_protocol_init
  - custom_rules
  - discarded_notification_center_observer
  - duplicate_conditions
  - duplicate_enum_cases
  - duplicate_imports
  - duplicated_key_in_dictionary_literal
  - dynamic_inline
  - invalid_swiftlint_command
  - line_length
  - multiline_parameters
  - notification_center_detachment
  - nsobject_prefer_isequal
  - overridden_super_call
  - prohibited_super_call
  - return_value_from_void_function
  - self_in_property_initialization
  - superfluous_disable_command
  - unavailable_condition
  - unneeded_override
  - unused_closure_parameter
  - unused_control_flow_label
  - unused_enumerated
  - unused_optional_binding
  - valid_ibinspectable
  - weak_delegate

line_length:
  warning: 120
  error: 120
  ignores_comments: false
  ignores_urls: false
  ignores_function_declarations: false
  ignores_interpolated_strings: false

custom_rules:
  multiline_declaration_body:
    name: Multiline declaration body
    regex: '\b(?:func\s+[^\n{}]*|var\s+\w+\s*:[^\n{}=]*)\{(?![ \t]*(?:get|set)(?:[ \t]+(?:get|set))?[ \t]*\})[^\n]*\}'
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: Put the body of the function or computed property on separate lines.
    severity: error
  multiple_statements_per_line:
    name: Multiple statements per line
    regex: ';(?=[ \t]*(?!//|/\*|\}|$)\S)'
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: Put each statement on its own line.
    severity: error
